name: qa-platform
x-env: &environment
  DATABASE_URL: postgresql+psycopg://qa:qa_local_only@postgres:5432/qa_shop
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP: kafka:9092
  ADMIN_EMAIL: admin@example.test
  ADMIN_PASSWORD: Admin-study-123
x-app: &app
  image: qa-platform-app:local
  build:
    context: .
    target: app
  environment: *environment
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa_local_only
      POSTGRES_DB: qa_shop
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_shop"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-bookworm
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka-storage-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    volumes: ["kafka-data:/data"]
  kafka:
    image: apache/kafka:3.9.1
    depends_on:
      kafka-storage-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:59092:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
  topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "qa.payment.requested.v1", "--partitions", "1", "--replication-factor", "1"]
  init:
    <<: *app
    command: ["python", "-m", "shop.init_db"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    <<: *app
    ports: ["127.0.0.1:8010:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
  grpc:
    <<: *app
    command: ["python", "-m", "shop.grpc_server"]
    ports: ["127.0.0.1:50051:50051"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
  worker:
    <<: *app
    command: ["python", "-m", "shop.worker"]
    depends_on:
      init: {condition: service_completed_successfully}
      topic-init: {condition: service_completed_successfully}
volumes:
  postgres-data:
  kafka-data:
