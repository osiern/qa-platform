name: QA platform tests (JS, TS and Python)
on: [push, pull_request, workflow_dispatch]
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: academy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: academy/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start local shop
        run: |
          docker compose up -d --build
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2) as r:
                      if r.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Shop did not become ready')
          PY
      - name: Install test dependencies
        working-directory: academy
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install Python test dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m playwright install --with-deps chromium
      - name: Generate gRPC Python stubs
        run: python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. shop/proto/inventory.proto
      - name: Check TypeScript and run JS and TS E2E
        working-directory: academy
        run: |
          npm run typecheck
          npm run test:js
          npm run test:ts
      - name: Run Python E2E
        working-directory: academy/python-playwright
        run: python -m pytest
      - name: Run Python backend and API integration tests
        if: always()
        working-directory: academy/backend-api-tests
        run: python -m pytest
      - name: Generate Allure (including failed tests)
        if: always()
        working-directory: academy
        run: npm run allure:generate
      - name: Save service logs
        if: always()
        run: |
          mkdir -p academy/artifacts
          docker compose logs --no-color > academy/artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-reports
          path: academy/artifacts/
      - name: Remove this job's environment
        if: always()
        run: docker compose down -v --remove-orphans
