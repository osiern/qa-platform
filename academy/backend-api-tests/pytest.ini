[pytest]
testpaths = tests
addopts = -ra --strict-markers --clean-alluredir --alluredir=../artifacts/allure-results/backend-api-tests
markers =
    api: HTTP API integration tests
    grpc: gRPC service integration tests
    sql: SQL persistence tests
    postgres: PostgreSQL integrity and concurrency tests
    redis: Redis integration tests
    kafka: Kafka and payment worker integration tests
    docker: Compose environment smoke tests
    e2e: cross-service end-to-end tests
